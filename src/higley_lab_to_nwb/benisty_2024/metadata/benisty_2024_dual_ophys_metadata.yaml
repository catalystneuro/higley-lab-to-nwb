# Keyed ophys metadata (NeuroConv >= 0.11). The keys are handles that link the entries; `name` is the name in the file.
DeviceModels:
  two_photon_microscope_model:
    name: TwoPhotonMicroscopeModel
    manufacturer: Sutter Instruments
  one_photon_microscope_model:
    name: OnePhotonMicroscopeModel
    manufacturer: Zeiss
Devices:
  two_photon_microscope:
    name: TwoPhotonMicroscope
    description: MOM microscope (Sutter Instruments) coupled to a 16x, 0.8 NA objective (Nikon). Excitation was driven by
      a Titanium-Sapphire Laser (Mai-Tai eHP DeepSee, Spectra-Physics).
    device_model_metadata_key: two_photon_microscope_model
  one_photon_microscope:
    name: OnePhotonMicroscope
    description: Zeiss Axiozoom with a 1x, 0.25 NA objective with a 56 mm working distance. Epifluorescent excitation was
      provided by an LED bank (Spectra X Light Engine, Lumencor). To image through the implanted prism, a long-working distance
      objective (20x, 0.4 NA, Mitutoyo) was used.
    device_model_metadata_key: one_photon_microscope_model
Ophys:
  ImagingPlanes:
    two_photon:
      name: TwoPhotonImagingPlane
      description: Imaging plane for the Green channel recorded with 2p microscope.
      excitation_lambda: 920.0
      location: Whole Brain
      optical_channel:
      - name: Green
        description: Emitted light was collected through a 525/50 filter and a gallium arsenide phosphide photomultiplier
          tube (Hamamatsu).
        emission_lambda: 525.0
      indicator: GCaMP6s
      device_metadata_key: two_photon_microscope
    one_photon:
      name: OnePhotonImagingPlane
      description: Imaging plane for the Green channel recorded with 1p microscope.
      excitation_lambda: 470.0
      location: Whole Brain
      optical_channel:
      - name: Green
        description: Emitted light was collected through a 525/50 filter and a gallium arsenide phosphide photomultiplier
          tube (Hamamatsu).
        emission_lambda: 525.0
      indicator: GCaMP6s
      device_metadata_key: one_photon_microscope
    one_photon_isosbestic:
      name: OnePhotonImagingPlaneIsosbestic
      description: Imaging plane for the Isosbestic Green channel recorded with 1p microscope.
      excitation_lambda: 395.0
      location: Whole Brain
      optical_channel:
      - name: Green
        description: Emitted light was collected through a 525/50 filter and a gallium arsenide phosphide photomultiplier
          tube (Hamamatsu).
        emission_lambda: 525.0
      indicator: GCaMP6s
      device_metadata_key: one_photon_microscope
  MicroscopySeries:
    two_photon:
      name: TwoPhotonSeries
      description: Imaging data from Green channel recorded with 2p microscope. Images were acquired at 512x512 resolution
        using a galvo-resonant scan system controlled by ScanImage software (Vidrio).
      unit: n.a.
      imaging_plane_metadata_key: two_photon
    raw_blue:
      name: OnePhotonSeries
      description: Imaging data from Green channel recorded with 1p microscope. Images were acquired at 576x576 resolution
        after 45x pixel binning with 20ms exposure.
      unit: n.a.
      imaging_plane_metadata_key: one_photon
    raw_violet:
      name: OnePhotonSeriesIsosbestic
      description: Imaging data recorded with 1p microscope for isosbestic control. Images were acquired at 576x576 resolution
        after 45x pixel binning with 20ms exposure.
      unit: n.a.
      imaging_plane_metadata_key: one_photon_isosbestic
    dff_blue:
      name: DffOnePhotonSeries
      description: Processed imaging data from Green channel recorded with 1p microscope. Raw images are detrended and baseline
        corrected to calculate DF/F images. Specifically, for each pixel, a 100th-order fir filter with 0.001-Hz frequency
        cutoff was applied to extract the low-pass-filtered signal. This low-pass signal was used as baseline (F0), and DF/F
        for each pixel was calculated as (F − F0)/F0, where F is the raw unfiltered signal.
      unit: n.a.
      imaging_plane_metadata_key: one_photon
    dff_violet:
      name: DffOnePhotonSeriesIsosbestic
      description: Processed imaging data from Green channel recorded with 1p microscope for isosbestic control. Raw images
        are detrended and baseline corrected to calculate DF/F images. Specifically, for each pixel, a 100th-order fir filter
        with 0.001-Hz frequency cutoff was applied to extract the low-pass-filtered signal. This low-pass signal was used
        as baseline (F0), and DF/F for each pixel was calculated as (F − F0)/F0, where F is the raw unfiltered signal.
      unit: n.a.
      imaging_plane_metadata_key: one_photon_isosbestic
    hemodynamic_corrected:
      name: HemodynamicCorrectedOnePhotonSeries
      description: Processed imaging data from Green channel recorded with 1p microscope. Hemodynamic artifact removal is
        implemented as the optimal linear predictor for the neuronal time series, given the 470-nm and 395-nm excitation signals.
      unit: n.a.
      imaging_plane_metadata_key: one_photon
  PlaneSegmentations:
    suite2p:
      name: Suite2pPlaneSegmentation
      description: ROIs segmented with Suite2p.
      imaging_plane_metadata_key: two_photon
    cidan:
      name: CIDANPlaneSegmentation
      description: ROIs segmented with CIDAN.
      imaging_plane_metadata_key: two_photon
