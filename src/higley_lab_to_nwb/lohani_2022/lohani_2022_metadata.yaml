SessionDescriptions:
  spont: Dual-color mesoscopic imaging of ACh (ACh3.0) and calcium (jRCaMP1b) across the dorsal neocortex of an awake mouse, head-fixed and free to run on a cylindrical wheel, during the second half of the light cycle. Wheel motion was recorded with a magnetic angle sensor (Digikey), and the face (pupil and facial movement, analysed with FaceMap) with a CMOS camera (Blackfly S USB3, FLIR) at 10 Hz under infrared illumination. No stimuli were presented.
  vis_stim: Dual-color mesoscopic imaging of ACh (ACh3.0) and calcium (jRCaMP1b) across the dorsal neocortex of an awake mouse, head-fixed and free to run on a cylindrical wheel, during the second half of the light cycle. Wheel motion was recorded with a magnetic angle sensor (Digikey), and the face (pupil and facial movement, analysed with FaceMap) with a CMOS camera (Blackfly S USB3, FLIR) at 10 Hz under infrared illumination. Small (20 degree diameter) sinusoidal drifting gratings (2 Hz, 0.04 cycles per degree) were generated using Psychtoolbox in MATLAB and presented on an LCD monitor at a distance of 20 cm, for 1-2 s each. The Methods give 100% contrast; the contrast, orientation and position of each presentation are in the VisualStimulus table.
  airpuffs: Dual-color mesoscopic imaging of ACh (ACh3.0) and calcium (jRCaMP1b) across the dorsal neocortex of an awake mouse, head-fixed and free to run on a cylindrical wheel, during the second half of the light cycle. Wheel motion was recorded with a magnetic angle sensor (Digikey), and the face (pupil and facial movement, analysed with FaceMap) with a CMOS camera (Blackfly S USB3, FLIR) at 10 Hz under infrared illumination. Air-puff stimuli were delivered using a thin metal tube aimed at the fur along the back and coupled to a solenoid valve (Clark Solutions) that delivered brief (200 ms) puffs of compressed air.
