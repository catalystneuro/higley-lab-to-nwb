NWBFile:
  related_publications:
    - https://doi.org/10.1038/s41593-022-01202-6
    - https://github.com/cardin-higley-lab/Lohani_Moberly_et_al_2022
  keywords: [calcium imaging, ACh imaging, cholinergic activity, neocortex activity, dual-color mesoscopic imaging]
  experiment_description: Dual-color mesoscopic imaging of both ACh and calcium across the neocortex of awake mice to investigate their relationships with behavioral variables. We find that higher arousal, categorized by different motor behaviors, is associated with spatiotemporally dynamic patterns of cholinergic modulation and enhanced large-scale network correlations. Overall, our findings demonstrate that ACh provides a highly dynamic and spatially heterogeneous signal that links fluctuations in behavior to functional reorganization of cortical networks.
  institution: Yale University School of Medicine
  lab: Higley
  experimenter:
    - Lohani, Sweyta
    - Moberly, Andrew
  surgery: All surgical implantation procedures were performed on adult mice (>P50D). Mice were anesthetized using 1-2% isoflurane and maintained at 37 °C for the duration of the surgery. The skin and fascia above the skull were removed from the nasal bone to the posterior of the intraparietal bone and laterally between the temporal muscles. The surface of the skull was thoroughly cleaned with saline, and the edges of the incision were secured to the skull with Vetbond. A custom titanium headpost was secured to the posterior of the nasal bone with transparent dental cement (Metabond, Parkell), and a thin layer of dental cement was applied to the entire dorsal surface of the skull. Next, a layer of cyanoacrylate (Maxi-Cure, Bob Smith Industries) was used to cover the skull and left to cure approximately 30 min at 22-24 °C room temperature to provide a smooth surface for transcranial imaging.
  virus: P0-P1 pups were injected bilaterally into the transverse sinus, at 10 nl/s, with 2 μl of AAV9-hsyn-ACh3.0 (1.8 x 10^13 gc/ml) and 2 μl of AAV9-hsyn-NES-jRCaMP1b (2.5 x 10^13 gc/ml; Addgene) per hemisphere.
