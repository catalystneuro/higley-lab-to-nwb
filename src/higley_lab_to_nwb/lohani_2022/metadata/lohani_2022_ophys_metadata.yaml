# Keyed ophys metadata (NeuroConv >= 0.11). The keys are handles that link the entries; `name` is the name in the file.
DeviceModels:
  hamamatsu_orca_flash:
    name: C13440-20C
    manufacturer: Hamamatsu
    model_number: C13440-20C
Devices:
  mesoscope:
    name: OnePhotonMicroscope
    description: "Dual-camera widefield mesoscope. Camera Type: DUAL_DCAM, two C13440-20C cameras, S/N 301751 and S/N 300073."
    device_model_metadata_key: hamamatsu_orca_flash
Ophys:
  ImagingPlanes:
    blue:
      name: ImagingPlaneBlueExcitationGreenChannel
      description: Imaging plane for the Green channel recorded during Blue excitation.
      device_metadata_key: mesoscope
      excitation_lambda: 470.0  # in nm
      imaging_rate: 10.0  # in Hz, per excitation channel
      location: Neocortex
      indicator: ACh3.0
      optical_channel:
        - name: Green
          description: Green channel of the microscope, 525/50 nm filter.
          emission_lambda: 525.0
    violet:
      name: ImagingPlaneVioletExcitationGreenChannel
      description: Imaging plane for the Green channel recorded during Violet excitation.
      device_metadata_key: mesoscope
      excitation_lambda: 395.0  # in nm
      imaging_rate: 10.0  # in Hz, per excitation channel
      location: Neocortex
      indicator: ACh3.0
      optical_channel:
        - name: Green
          description: Green channel of the microscope, 525/50 nm filter.
          emission_lambda: 525.0
    green:
      name: ImagingPlaneGreenExcitationRedChannel
      description: Imaging plane for the Red channel recorded during Green excitation.
      device_metadata_key: mesoscope
      excitation_lambda: 575.0  # in nm
      imaging_rate: 10.0  # in Hz, per excitation channel
      location: Neocortex
      indicator: jRCaMP1b
      optical_channel:
        - name: Red
          description: Red channel of the microscope, 630/75 nm filter.
          emission_lambda: 630.0
  MicroscopySeries:
    raw_blue:
      name: OnePhotonSeriesBlueExcitationGreenChannel
      description: Imaging data from Green channel recorded with Blue excitation.
      imaging_plane_metadata_key: blue
      unit: n.a.
    raw_violet:
      name: OnePhotonSeriesVioletExcitationGreenChannel
      description: Imaging data from Green channel recorded with Violet excitation.
      imaging_plane_metadata_key: violet
      unit: n.a.
    raw_green:
      name: OnePhotonSeriesGreenExcitationRedChannel
      description: Imaging data from Red channel recorded with Green excitation.
      imaging_plane_metadata_key: green
      unit: n.a.
    dff_blue:
      name: DFFOnePhotonSeriesBlue
      description: Processed Imaging data from Green channel recorded with Blue excitation. The raw frames were downsampled to 256 x 256 pixels and rotated by 180 degrees, then detrended and baseline corrected to calculate DF/F images. Specifically, for each pixel, a low-pass fir1 filter with 0.001 Hz cutoff was applied to extract the baseline (F0), and DF/F was calculated as (F - F0)/F0, where F is the raw unfiltered signal. The Methods give a 100th-order filter; the lab's preprocessing code uses a filter length of 1000, and the first 499 and last 500 frames are removed to avoid filter edge artifacts, so DF/F frame 0 is raw frame 499. The DF/F images were then registered to the Allen Common Coordinate Framework (CCFv3). They were corrected for hemodynamic artifacts by spatial regression against the Violet excitation DF/F (Methods, Hemodynamic correction). Pixels without data in the lab's output are NaN.
      imaging_plane_metadata_key: blue
      unit: n.a.
    dff_violet:
      name: DFFOnePhotonSeriesViolet
      description: Processed Imaging data from Green channel recorded with Violet excitation. The raw frames were downsampled to 256 x 256 pixels and rotated by 180 degrees, then detrended and baseline corrected to calculate DF/F images. Specifically, for each pixel, a low-pass fir1 filter with 0.001 Hz cutoff was applied to extract the baseline (F0), and DF/F was calculated as (F - F0)/F0, where F is the raw unfiltered signal. The Methods give a 100th-order filter; the lab's preprocessing code uses a filter length of 1000, and the first 499 and last 500 frames are removed to avoid filter edge artifacts, so DF/F frame 0 is raw frame 499. The DF/F images were then registered to the Allen Common Coordinate Framework (CCFv3). They were not corrected for hemodynamic artifacts; they are the regressor of that correction for the Blue and Green excitation DF/F. Pixels without data in the lab's output are NaN.
      imaging_plane_metadata_key: violet
      unit: n.a.
    dff_green:
      name: DFFOnePhotonSeriesGreen
      description: Processed Imaging data from Red channel recorded with Green excitation. The raw frames were downsampled to 256 x 256 pixels, registered to the Green channel camera images and rotated by 180 degrees, then detrended and baseline corrected to calculate DF/F images. Specifically, for each pixel, a low-pass fir1 filter with 0.001 Hz cutoff was applied to extract the baseline (F0), and DF/F was calculated as (F - F0)/F0, where F is the raw unfiltered signal. The Methods give a 100th-order filter; the lab's preprocessing code uses a filter length of 1000, and the first 499 and last 500 frames are removed to avoid filter edge artifacts, so DF/F frame 0 is raw frame 499. The DF/F images were then registered to the Allen Common Coordinate Framework (CCFv3). They were corrected for hemodynamic artifacts by spatial regression against the Violet excitation DF/F (Methods, Hemodynamic correction). Pixels without data in the lab's output are NaN.
      imaging_plane_metadata_key: green
      unit: n.a.
  PlaneSegmentations:
    parcellation:
      name: ParcellatedPlaneSegmentation
      description: ROIs of a functional parcellation (local selective spectral clustering) of the calcium DF/F (Red channel, Green excitation). The ROIs are not the Allen CCFv3 parcels analysed in the paper, which are in AllenParcelsPlaneSegmentation.
      imaging_plane_metadata_key: green
  RoiResponses:
    parcellation:
      dff:
        name: RoiResponseSeriesParcellated
        description: Mean calcium DF/F (Red channel, Green excitation) over each ROI of the functional parcellation. Its frame 0 is DF/F frame 150.
        unit: n.a.
