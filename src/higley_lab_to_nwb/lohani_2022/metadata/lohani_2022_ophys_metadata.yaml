Ophys:
  Device:
    - name: OnePhotonMicroscope
      description: "Camera Type: DUAL_DCAM, Camera Name: C13440-20C S/N: 301751 S/N: 300073"
      manufacturer: Hamamatsu Inc.
  OnePhotonSeries:
    - name: OnePhotonSeriesBlueExcitationGreenChannel
      description: Imaging data from Green channel recorded with Blue excitation.
      imaging_plane: ImagingPlaneBlueExcitationGreenChannel
      unit: n.a.
    - name: OnePhotonSeriesVioletExcitationGreenChannel
      description: Imaging data from Green channel recorded with Violet excitation.
      imaging_plane: ImagingPlaneVioletExcitationGreenChannel
      unit: n.a.
    - name: OnePhotonSeriesGreenExcitationRedChannel
      description: Imaging data from Red channel recorded with Green excitation.
      imaging_plane: ImagingPlaneGreenExcitationRedChannel
      unit: n.a.
    - name: DFFOnePhotonSeriesBlue
      description: Processed Imaging data from Green channel recorded with Blue excitation. The raw frames were downsampled to 256 x 256 pixels and rotated by 180 degrees, then detrended and baseline corrected to calculate DF/F images. Specifically, for each pixel, a low-pass fir1 filter with 0.001 Hz cutoff was applied to extract the baseline (F0), and DF/F was calculated as (F - F0)/F0, where F is the raw unfiltered signal. The Methods give a 100th-order filter; the lab's preprocessing code uses a filter length of 1000, and the first 499 and last 500 frames are removed to avoid filter edge artifacts, so DF/F frame 0 is raw frame 499. The DF/F images were then registered to the Allen Common Coordinate Framework (CCFv3). They were corrected for hemodynamic artifacts by spatial regression against the Violet excitation DF/F (Methods, Hemodynamic correction). Pixels without data (NaN in the lab's output) are written as 0.
      imaging_plane: ImagingPlaneBlueExcitationGreenChannel
      unit: n.a.
    - name: DFFOnePhotonSeriesViolet
      description: Processed Imaging data from Green channel recorded with Violet excitation. The raw frames were downsampled to 256 x 256 pixels and rotated by 180 degrees, then detrended and baseline corrected to calculate DF/F images. Specifically, for each pixel, a low-pass fir1 filter with 0.001 Hz cutoff was applied to extract the baseline (F0), and DF/F was calculated as (F - F0)/F0, where F is the raw unfiltered signal. The Methods give a 100th-order filter; the lab's preprocessing code uses a filter length of 1000, and the first 499 and last 500 frames are removed to avoid filter edge artifacts, so DF/F frame 0 is raw frame 499. The DF/F images were then registered to the Allen Common Coordinate Framework (CCFv3). They were not corrected for hemodynamic artifacts; they are the regressor of that correction for the Blue and Green excitation DF/F. Pixels without data (NaN in the lab's output) are written as 0.
      imaging_plane: ImagingPlaneVioletExcitationGreenChannel
      unit: n.a.
    - name: DFFOnePhotonSeriesGreen
      description: Processed Imaging data from Red channel recorded with Green excitation. The raw frames were downsampled to 256 x 256 pixels, registered to the Green channel camera images and rotated by 180 degrees, then detrended and baseline corrected to calculate DF/F images. Specifically, for each pixel, a low-pass fir1 filter with 0.001 Hz cutoff was applied to extract the baseline (F0), and DF/F was calculated as (F - F0)/F0, where F is the raw unfiltered signal. The Methods give a 100th-order filter; the lab's preprocessing code uses a filter length of 1000, and the first 499 and last 500 frames are removed to avoid filter edge artifacts, so DF/F frame 0 is raw frame 499. The DF/F images were then registered to the Allen Common Coordinate Framework (CCFv3). They were corrected for hemodynamic artifacts by spatial regression against the Violet excitation DF/F (Methods, Hemodynamic correction). Pixels without data (NaN in the lab's output) are written as 0.
      imaging_plane: ImagingPlaneGreenExcitationRedChannel
      unit: n.a.
  ImagingPlane:
    - name: ImagingPlaneBlueExcitationGreenChannel
      description: Imaging plane for the Green channel recorded during Blue excitation.
      excitation_lambda: 470.0  # in nm
      location: Neocortex
      device: OnePhotonMicroscope
      optical_channel:
        - name: Green
          description: Green channel of the microscope, 525/50 nm filter.
          emission_lambda: 525.0
      indicator: ACh3.0
    - name: ImagingPlaneVioletExcitationGreenChannel
      description: Imaging plane for the Green channel recorded during Violet excitation.
      excitation_lambda: 395.0  # in nm
      location: Neocortex
      device: OnePhotonMicroscope
      optical_channel:
        - name: Green
          description: Green channel of the microscope, 525/50 nm filter.
          emission_lambda: 525.0
      indicator: ACh3.0
    - name: ImagingPlaneGreenExcitationRedChannel
      description: Imaging plane for the Red channel recorded during Green excitation.
      excitation_lambda: 575.0  # in nm
      location: Neocortex
      device: OnePhotonMicroscope
      optical_channel:
        - name: Red
          description: Red channel of the microscope, 630/75 nm filter.
          emission_lambda: 630.0
      indicator: jRCaMP1b
